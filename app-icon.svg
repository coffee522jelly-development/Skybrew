<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Transparent background -->
  <rect width="1024" height="1024" rx="256" fill="transparent"/>

  <!-- Mug Handle -->
  <path d="M720 520 h100 a 120 120 0 0 1 0 240 h-100" fill="none" stroke="#1E3A8A" stroke-width="80" stroke-linecap="round"/>

  <!-- Mug Body (Night Sky) -->
  <path d="M250 400 h440 v280 a 220 220 0 0 1 -440 0 z" fill="#0F172A"/>

  <!-- Mug Top Rim -->
  <ellipse cx="470" cy="400" rx="220" ry="40" fill="#1E293B"/>

  <!-- Coffee inside -->
  <ellipse cx="470" cy="400" rx="190" ry="30" fill="#3E2723"/>
  <ellipse cx="470" cy="400" rx="170" ry="20" fill="#2E1A14"/>

  <!-- Crescent Moon on the Mug -->
  <path d="M380 550 a 60 60 0 1 0 80 80 a 70 70 0 1 1 -80 -80 z" fill="#FDE047"/>

  <!-- Stars on the Mug -->
  <circle cx="340" cy="650" r="8" fill="#FFFBEB"/>
  <circle cx="520" cy="520" r="10" fill="#FFFBEB"/>
  <circle cx="580" cy="620" r="6" fill="#FFFBEB"/>
  <circle cx="320" cy="500" r="5" fill="#FFFBEB"/>
  <circle cx="450" cy="700" r="7" fill="#FFFBEB"/>

  <!-- Steam -->
  <path d="M420 320 Q 370 220 420 120" fill="none" stroke="#CBD5E1" stroke-width="25" stroke-linecap="round" opacity="0.6"/>
  <path d="M520 300 Q 570 200 520 100" fill="none" stroke="#CBD5E1" stroke-width="25" stroke-linecap="round" opacity="0.6"/>
</svg>
